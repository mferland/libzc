---
name: Build Windows executable
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-mingw64:
    runs-on: ubuntu-latest
    env:
      MMAN_WIN32_COMMIT: fedbdbf167241503c4a8250c1666be580890c4e2
      PTHREADS4W_COMMIT: 8e467a62a14fd9de15af33beec0a913d23f4d2f9

    steps:
      - name: Install dependencies
        run: |
          sudo apt install -y git make automake libtool-bin autoconf bison flex zlib1g-dev pkg-config check gcc mingw-w64 mingw-w64-x86-64-dev libz-mingw-w64-dev wine64 zip

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install mman-win32
        run: |
          git clone --no-checkout https://github.com/alitrack/mman-win32.git
          git -C mman-win32 checkout --detach "$MMAN_WIN32_COMMIT"
          cd mman-win32
          ./configure --prefix=/usr/x86_64-w64-mingw32 --enable-static --cc=x86_64-w64-mingw32-gcc --cross-prefix=x86_64-w64-mingw32-
          make
          sudo make install

      - name: Install pthreads4w
        run: |
          git clone --no-checkout https://git.code.sf.net/p/pthreads4w/code pthreads4w
          git -C pthreads4w checkout --detach "$PTHREADS4W_COMMIT"
          cd pthreads4w
          cp ${GITHUB_WORKSPACE}/docker/mingw64/0001-Temp-Makefile-fix.patch .
          git apply 0001-Temp-Makefile-fix.patch
          autoreconf --install
          ./configure --prefix=/usr/x86_64-w64-mingw32/local --host=x86_64-w64-mingw32
          make clean GC
          sudo make install

      - name: Run build script
        run: |
          scripts/build-mingw64.sh ${GITHUB_WORKSPACE}

      - name: Smoke test Windows executable
        env:
          WINEARCH: win64
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wine-prefix
        run: |
          /usr/lib/wine/wine64 build-mingw64/yazc-v*/yazc.exe --help

      - name: Upload Windows archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: yazc-win64
          path: build-mingw64/yazc-v*-win64.zip
          if-no-files-found: error
          retention-days: 7
