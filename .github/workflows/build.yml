---
name: Build
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            artifact: ubuntu-24.04
            experimental: false
          - name: Fedora 44
            image: fedora:44
            artifact: fedora-44
            experimental: false
          - name: Clang 15 on Debian 11
            image: silkeh/clang:15-bullseye
            artifact: clang-15-debian-11
            cc: "clang"
            experimental: false
          - name: GCC 15.2 on Debian 12
            image: gcc:15.2.0-bookworm
            artifact: gcc-15.2-debian-12
            experimental: false
          - name: Debian unstable
            image: debian:unstable
            artifact: debian-unstable
            experimental: true

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - if: ${{ matrix.cc }}
        run: echo CC=${{ matrix.cc }} >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          ./scripts/install-deps.sh

      - name: autogen
        run: |
          ./autogen.sh

      - name: configure
        run: |
          ./configure CFLAGS="-O0 -g"

      - name: make check
        run: |
          make check

      - name: upload check logs
        uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: check-logs-${{ matrix.artifact }}
          path: |
            config.log
            tests/test-suite.log
            tests/*.log
          if-no-files-found: warn
          retention-days: 3

  sanitizers:
    name: Clang sanitizers
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: |
          ./scripts/install-deps.sh
          apt install -yq clang

      - name: autogen
        run: |
          ./autogen.sh

      - name: configure
        env:
          CC: clang
          CFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
          LDFLAGS: -fsanitize=address,undefined
        run: |
          ./configure

      - name: make check
        env:
          ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make check

  distcheck:
    name: Source distribution
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: |
          ./scripts/install-deps.sh

      - name: autogen
        run: |
          ./autogen.sh

      - name: configure
        run: |
          ./configure CFLAGS="-O0 -g"

      - name: make distcheck
        run: |
          make distcheck
